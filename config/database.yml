default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: brickcrm_development

test:
  <<: *default
  database: brickcrm_test

production:
  primary: &primary_production
    <<: *default
    database: brickcrm_prod
  cache:
    <<: *primary_production
    database: brickcrm_prod_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: brickcrm_prod_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: brickcrm_prod_cable
    migrations_paths: db/cable_migrate
